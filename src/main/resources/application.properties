spring.application.name=relayguard
server.address=127.0.0.1
server.port=${PORT:8080}
spring.datasource.url=jdbc:h2:file:./data/relayguard;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.sql.init.mode=always
spring.jackson.serialization.write-dates-as-timestamps=false
server.error.include-message=never
relayguard.webhook-secret=${RELAYGUARD_WEBHOOK_SECRET:local-demo-secret-change-me}
relayguard.worker-enabled=${RELAYGUARD_WORKER_ENABLED:true}
relayguard.worker-delay-ms=2000
